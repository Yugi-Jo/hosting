<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hosting</title>
<style>
  :root{
    --bg:#0e0f12; --card:#16181d; --line:#24262d;
    --fg:#f2f3f5; --dim:#8b8f99; --accent:#e8a13a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:72px 24px 96px}
  h1{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 40px}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
  a.item{
    display:flex;align-items:baseline;gap:16px;
    padding:20px 22px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:inherit;text-decoration:none;
    transition:border-color .15s ease,transform .15s ease;
  }
  a.item:hover{border-color:var(--accent);transform:translateY(-1px)}
  .name{font-size:17px;font-weight:550}
  .slug{margin-left:auto;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  .note{margin-top:44px;font-size:14px;color:var(--dim);border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Hosting</h1>
    <ul>
      <li><a class="item" href="./super-quant-cards/"><span class="name">Super Quant Cards</span><span class="slug">super-quant-cards</span></a></li>
      <li><a class="item" href="./yugi-jo-strategy-deck/"><span class="name">Yugi Jo Strategy Deck</span><span class="slug">yugi-jo-strategy-deck</span></a></li>
      <li><a class="item" href="./EditorsHandbook/"><span class="name">Editor's Handbook</span><span class="slug">EditorsHandbook</span></a></li>
    </ul>
    <p class="note">One-off hosted pages. New artifacts go in their own subfolder here.</p>
  </div>
</body>
</html>
